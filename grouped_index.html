<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Третий тест: TCP/IP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:         #f0f2f8;
  --surface:    #ffffff;
  --card:       #ffffff;
  --border:     #dde2ef;
  --border2:    #c8cedf;
  --accent:     #2563eb;
  --accent-bg:  #eff4ff;
  --green:      #16a34a;
  --green-bg:   #f0fdf4;
  --green-bd:   #86efac;
  --yellow:     #92400e;
  --yellow-bg:  #fffbeb;
  --yellow-bd:  #fcd34d;
  --teal:       #0d9488;
  --teal-bg:    #f0fdfa;
  --teal-bd:    #5eead4;
  --muted:      #6b7280;
  --text:       #1f2937;
  --texthi:     #111827;
  --radius:     12px;
  --mono:       'JetBrains Mono', monospace;
  --sans:       'Inter', system-ui, sans-serif;
  --shadow:     0 1px 3px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.05);
  --shadow-md:  0 4px 20px rgba(0,0,0,.1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 80px;
  font-size: 17px;
  line-height: 1.65;
}
header {
  background: #fff;
  border-bottom: 1px solid var(--border);
  padding: 20px 32px 18px;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 1px 6px rgba(0,0,0,.06);
}
.header-inner { max-width: 880px; margin: 0 auto; }
.logo {
  font-family: var(--mono);
  font-size: 11px; font-weight: 500;
  letter-spacing: .14em; text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.logo-dot { width: 7px; height: 7px; background: var(--accent); border-radius: 50%; }
.search-wrap { position: relative; }
.search-icon {
  position: absolute; left: 16px; top: 50%;
  transform: translateY(-50%);
  color: var(--muted); font-size: 19px; pointer-events: none;
}
#search {
  width: 100%;
  background: var(--bg);
  border: 1.5px solid var(--border2);
  border-radius: var(--radius);
  padding: 13px 16px 13px 48px;
  font-family: var(--sans); font-size: 16px; color: var(--texthi);
  outline: none;
  transition: border-color .18s, box-shadow .18s;
}
#search::placeholder { color: #9ca3af; }
#search:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(37,99,235,.1);
  background: #fff;
}
.search-meta {
  margin-top: 10px; font-size: 13px; color: var(--muted);
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}
.badge {
  background: var(--accent-bg); color: var(--accent);
  padding: 2px 12px; border-radius: 99px;
  font-size: 12px; font-family: var(--mono);
  border: 1px solid rgba(37,99,235,.2);
}
main {
  max-width: 880px; margin: 22px auto 0; padding: 0 32px;
  display: flex; flex-direction: column; gap: 18px;
}
.group {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.group-head {
  padding: 4px 2px 0;
}
.group-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--texthi);
  line-height: 1.35;
}
.group-meta {
  margin-top: 4px;
  color: var(--muted);
  font-size: 13px;
  font-family: var(--mono);
}
.group-items {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.qcard {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.qcard-head {
  padding: 22px 24px 18px;
  display: flex; gap: 14px; align-items: flex-start;
  border-bottom: 1px solid var(--border);
}
.qnum {
  font-family: var(--mono); font-size: 11px; font-weight: 500;
  color: var(--muted); background: var(--bg);
  border: 1px solid var(--border2); border-radius: 7px;
  padding: 3px 10px; white-space: nowrap;
  margin-top: 3px; flex-shrink: 0;
}
.qtext {
  font-size: 18px; font-weight: 600;
  color: var(--texthi); line-height: 1.5; flex: 1;
}
mark { background: #fef9c3; color: #854d0e; border-radius: 3px; padding: 0 2px; }
.qcard-body { padding: 18px 24px 22px; }
.ans-list { display: flex; flex-direction: column; gap: 8px; }
.ans-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 16px; border-radius: 9px;
  border: 1.5px solid var(--border);
  font-size: 16px; line-height: 1.55;
  color: var(--muted); background: var(--bg);
}
.ans-item.correct {
  border-color: var(--green-bd); background: var(--green-bg); color: var(--texthi);
}
.ans-item.incorrect { opacity: .7; }
.ans-icon {
  flex-shrink: 0; width: 22px; height: 22px;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; margin-top: 1px;
}
.correct .ans-icon { background: var(--green); color: #fff; }
.incorrect .ans-icon { background: var(--border2); color: var(--muted); }
.single-answer {
  display: flex; align-items: flex-start; gap: 10px;
  background: var(--green-bg); border: 1.5px solid var(--green-bd);
  border-radius: 9px; padding: 13px 16px;
  font-size: 16px; line-height: 1.55; color: var(--texthi);
}
.sa-label {
  font-family: var(--mono); font-size: 10px; font-weight: 500;
  letter-spacing: .08em; color: var(--green);
  white-space: nowrap; margin-top: 3px; opacity: .8;
}
.rank-list { display: flex; flex-direction: column; gap: 7px; }
.rank-item {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 16px; border-radius: 9px;
  border: 1.5px solid var(--yellow-bd); background: var(--yellow-bg);
  font-size: 16px;
}
.rank-num {
  font-family: var(--mono); font-size: 13px; font-weight: 500;
  color: var(--yellow); min-width: 26px; flex-shrink: 0;
}
.pairs-list { display: flex; flex-direction: column; gap: 8px; }
.pair-item {
  display: flex; align-items: center; gap: 8px;
  padding: 11px 16px; border-radius: 9px;
  border: 1.5px solid var(--teal-bd); background: var(--teal-bg);
  font-size: 16px; flex-wrap: wrap;
}
.pair-left { color: var(--texthi); font-weight: 600; flex: 1; min-width: 120px; }
.pair-arrow { color: var(--teal); flex-shrink: 0; font-size: 18px; }
.pair-right { color: var(--teal); flex: 1; min-width: 120px; font-weight: 500; }
.qimages { margin-bottom: 16px; display: flex; gap: 10px; flex-wrap: wrap; }
.qimages img {
  max-width: 340px; max-height: 240px;
  border-radius: 8px; border: 1.5px solid var(--border);
  object-fit: contain; background: #f9fafb;
  cursor: zoom-in; transition: box-shadow .18s;
}
.qimages img:hover { box-shadow: var(--shadow-md); }
#empty {
  text-align: center; padding: 80px 20px;
  color: var(--muted); font-size: 15px; display: none;
}
#lightbox {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.78); backdrop-filter: blur(5px);
  z-index: 999; align-items: center; justify-content: center;
}
#lightbox.open { display: flex; }
#lightbox img { max-width: 92vw; max-height: 90vh; border-radius: 10px; }
#lightbox-close {
  position: fixed; top: 18px; right: 22px;
  background: rgba(255,255,255,.15); border: none; color: #fff;
  font-size: 20px; width: 38px; height: 38px;
  border-radius: 50%; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
#lightbox-close:hover { background: rgba(255,255,255,.3); }
#totop {
  position: fixed; bottom: 28px; right: 28px;
  width: 44px; height: 44px; background: var(--accent);
  border: none; border-radius: 12px; color: #fff;
  font-size: 20px; cursor: pointer;
  box-shadow: 0 4px 14px rgba(37,99,235,.35);
  display: none; align-items: center; justify-content: center;
  transition: transform .15s;
}
#totop.show { display: flex; }
#totop:hover { transform: translateY(-3px); }
@media (max-width: 640px) {
  body { font-size: 15px; }
  header { padding: 14px 16px 12px; }
  main { padding: 0 12px; }
  .qcard-head { padding: 16px 16px 14px; }
  .qcard-body { padding: 16px; }
  .qtext { font-size: 16px; }
  .ans-item, .rank-item, .pair-item, .single-answer { font-size: 14px; }
}
</style>
</head>

<header>
  <div class="header-inner">

</div>
<button id="totop" title="Наверх">↑</button>

const searchEl = document.getElementById('search');
const mainEl = document.getElementById('main');
const emptyEl = document.getElementById('empty');
const counterEl = document.getElementById('counter');
const groupCounterEl = document.getElementById('group-counter');

function esc(s) {
  return String(s ?? "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function hi(s, q) {
  if (!q) return esc(s);
  const rx = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
  return esc(s).replace(rx, m => `<mark>${m}</mark>`);
}
function imgSrc(filename) {
  return 'pics/' + filename.split('/').map(encodeURIComponent).join('/');
}
function renderBody(question, query) {
  if (!question) return '<p style="color:#9ca3af;font-size:14px">Вопрос не найден в T_body</p>';
  if (question.type_id === 1 || question.type_id === 2) {
    return '<div class="ans-list">' +
      question.answers.map(a => {
        const cls = a.correct ? 'correct' : 'incorrect';
        const icon = a.correct ? '✓' : '–';
        return `<div class="ans-item ${cls}"><span class="ans-icon">${icon}</span><span>${hi(a.text, query)}</span></div>`;
      }).join('') + '</div>';
  }
  if (question.type_id === 3) {
    return '<div class="rank-list">' +
      question.answers.map((a, i) =>
        `<div class="rank-item"><span class="rank-num">${i+1}.</span><span>${hi(a.text, query)}</span></div>`
      ).join('') + '</div>';
  }
  if (question.type_id === 7) {
    return `<div class="single-answer"><span class="sa-label">ОТВЕТ</span><span>${hi(question.correct_answer ?? '', query)}</span></div>`;
  }
  if (question.type_id === 5 || question.type_id === 6) {
    return '<div class="pairs-list">' +
      question.answers.map(p =>
        `<div class="pair-item"><span class="pair-left">${hi(p.left, query)}</span><span class="pair-arrow">→</span><span class="pair-right">${hi(p.right, query)}</span></div>`
      ).join('') + '</div>';
  }
  return '<p style="color:#9ca3af;font-size:14px">Информационный блок</p>';
}
function renderImages(question) {
  if (!question || !question.images || !question.images.length) return '';
  return '<div class="qimages">' +
    question.images.map(f => {
      const src = imgSrc(f);
      const safeOnclick = src.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      return `<img src="${src}" alt="Изображение" loading="lazy" onerror="this.style.display='none'" onclick="openLb('${safeOnclick}')">`;
    }).join('') + '</div>';
}
function itemSearchText(group, item) {
  const q = item.question || {};
  const answerText = (q.answers || []).map(a => a.text || `${a.left || ''} ${a.right || ''}`).join(' ');
  return [
    group.name,
    q.question,
    q.correct_answer,
    answerText
  ].join(' ').toLowerCase();
}
function renderCard(item, num, query) {
  const q = item.question || null;
  const qHtml = hi(q?.question || '(текст вопроса не найден)', query);
  return `<div class="qcard" data-type="${q?.type_id ?? ''}">
  <div class="qcard-head">
    <span class="qnum">#${num}</span>
    <span class="qtext">${qHtml}</span>
  </div>
  <div class="qcard-body">
    ${renderImages(q)}${renderBody(q, query)}
  </div>
</div>`;
}

let currentQuery = '', debTimer;
searchEl.addEventListener('input', e => {
  clearTimeout(debTimer);
  debTimer = setTimeout(() => { currentQuery = e.target.value.trim(); renderAll(); }, 160);
});

function renderAll() {
  const query = currentQuery.trim();
  const q = query.toLowerCase();
  const groups = DATA.groups.map(group => {
    const items = q ? group.items.filter(item => itemSearchText(group, item).includes(q)) : group.items;
    return {...group, visibleItems: items};
  }).filter(group => group.visibleItems.length > 0);

  const totalQuestions = groups.reduce((sum, group) => sum + group.visibleItems.length, 0);
  counterEl.textContent = `${totalQuestions} вопросов`;
  groupCounterEl.textContent = `${groups.length} групп`;

  if (!groups.length) {
    mainEl.innerHTML = '';
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';

  mainEl.innerHTML = groups.map(group => `
    <section class="group">
      <div class="group-head">
        <div class="group-title">${hi(group.name, query)}</div>
        <div class="group-meta">ID ${group.group_id} · ${group.visibleItems.length} из ${group.items.length} · брать ${group.questions_per_group ?? '—'}</div>
      </div>
      <div class="group-items">
        ${group.visibleItems.map((item, idx) => renderCard(item, idx + 1, query)).join('')}
      </div>
    </section>
  `).join('');
}

function openLb(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target.id !== 'lightbox-img') document.getElementById('lightbox').classList.remove('open');
});
document.getElementById('lightbox-close').addEventListener('click', () =>
  document.getElementById('lightbox').classList.remove('open'));

const totop = document.getElementById('totop');
window.addEventListener('scroll', () => totop.classList.toggle('show', window.scrollY > 400));
totop.addEventListener('click', () => window.scrollTo({top:0,behavior:'smooth'}));

renderAll();
</script>
</body>
</html>
